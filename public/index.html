<!-- public/index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포켓몬 타입 스피드 퀴즈 온라인</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4">

  <!-- 상단 사운드 컨트롤 바 -->
  <div class="w-full max-w-6xl flex justify-between items-center bg-slate-800/90 border border-slate-700 px-4 py-2.5 rounded-xl mb-2 shadow">
    <div class="flex items-center gap-2">
      <span class="text-yellow-400 font-extrabold text-sm sm:text-base">⚡ 포켓몬 퀴즈 아레나</span>
    </div>
    <div class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm">
      <button id="btn-bgm" onclick="toggleBGM()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg font-bold transition">
        🎵 BGM: OFF
      </button>
      <button id="btn-sfx" onclick="toggleSFX()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg font-bold transition">
        🔊 효과음/울음소리: ON
      </button>
      <input id="vol-slider" type="range" min="0" max="1" step="0.05" value="0.5" onchange="changeVolume(this.value)"
        class="w-16 sm:w-24 accent-yellow-400 cursor-pointer" title="볼륨 조절" />
    </div>
  </div>

  <!-- 1. 닉네임 설정 화면 -->
  <div id="screen-nickname" class="w-full max-w-md bg-slate-800 rounded-2xl p-6 mt-14 shadow-xl border border-slate-700">
    <h1 class="text-2xl font-bold text-center text-yellow-400 mb-2">⚡ 포켓몬 타입 퀴즈 온라인</h1>
    <p class="text-slate-400 text-sm text-center mb-6">전 세대 포켓몬 실시간 멀티플레이 스피드 대결</p>
    <input id="input-nickname" type="text" maxlength="12" placeholder="사용할 닉네임 입력 (최대 12자)"
      onkeydown="if(event.key==='Enter') submitNickname()"
      class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 mb-4 focus:outline-none focus:border-yellow-400" />
    <button onclick="submitNickname()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 rounded-lg">
      입장하기 (사운드 활성화)
    </button>
  </div>

  <!-- 2. 로비 화면 (방 만들기 / 방 참가) -->
  <div id="screen-lobby" class="hidden w-full max-w-4xl mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- 방 생성 & 코드 입장 -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
      <h2 class="text-xl font-bold text-yellow-400 mb-4">🏠 게임방 만들기</h2>
      <label class="block text-sm text-slate-300 mb-1">방 제목</label>
      <input id="room-title" type="text" placeholder="누구나 환영! 포켓몬 고수만"
        class="w-full p-2.5 rounded bg-slate-900 border border-slate-600 mb-4" />

      <label class="block text-sm text-slate-300 mb-1">진행 라운드 수 (스페셜 조건 20% 확률 자동 등장)</label>
      <select id="room-rounds" class="w-full p-2.5 rounded bg-slate-900 border border-slate-600 mb-6">
        <option value="5">5 라운드 (빠른 게임)</option>
        <option value="10" selected>10 라운드 (표준)</option>
        <option value="15">15 라운드</option>
        <option value="20">20 라운드 (장기전)</option>
        <option value="30">30 라운드</option>
      </select>

      <button onclick="createRoom()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold py-3 rounded-lg mb-6">
        방 생성하기 (최대 10인)
      </button>

      <hr class="border-slate-700 my-4" />
      <h3 class="text-sm font-bold text-slate-300 mb-2">🔑 방 코드로 바로 입장</h3>
      <div class="flex gap-2">
        <input id="join-code" type="text" placeholder="4자리 코드 (예: AB12)" class="flex-1 p-2.5 rounded bg-slate-900 border border-slate-600 uppercase" />
        <button onclick="joinByCode()" class="bg-blue-500 hover:bg-blue-400 px-5 rounded font-bold">입장</button>
      </div>
    </div>

    <!-- 실시간 방 목록 -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex flex-col">
      <h2 class="text-xl font-bold text-blue-400 mb-4">🌐 현재 열린 방 목록</h2>
      <div id="room-list-container" class="flex-1 space-y-2 overflow-y-auto max-h-80"></div>
    </div>
  </div>

  <!-- 3. 게임방 화면 -->
  <div id="screen-game" class="hidden w-full max-w-6xl mt-2 grid grid-cols-1 lg:grid-cols-4 gap-4">
    <!-- 좌측: 참가자 목록 (최대 10명) -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
      <div class="flex justify-between items-center mb-3">
        <span id="badge-room-code" class="bg-slate-700 px-3 py-1 rounded text-sm font-mono text-yellow-400">CODE: ----</span>
        <span id="badge-round" class="text-sm text-slate-300 font-bold">대기 중</span>
      </div>
      <h3 class="font-bold text-slate-300 mb-2">참가 트레이너 (<span id="player-count">0</span>/10)</h3>
      <div id="player-list" class="space-y-2 mb-4"></div>
      <button id="btn-start-game" onclick="startGame()" class="hidden w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 rounded-xl">
        🚀 게임 시작하기
      </button>
    </div>

    <!-- 중앙: 타입 지목 & 문제 전광판 -->
    <div class="lg:col-span-2 bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-col justify-between min-h-[460px]">
      <div id="arena-status" class="text-center py-6">
        <p class="text-lg text-slate-300">방장이 게임을 시작하기를 기다리는 중...</p>
      </div>

      <!-- 타입 선택 그리드 (지목자에게만 활성화) -->
      <div id="type-picker-box" class="hidden">
        <p id="picker-guide" class="text-center text-yellow-400 font-bold mb-3"></p>
        <div id="type-buttons" class="grid grid-cols-6 gap-2"></div>
      </div>

      <!-- 정답 결과 도감 모달 영역 -->
      <div id="round-result-box" class="hidden bg-slate-900/90 p-4 rounded-xl border border-slate-700 mt-4">
        <div id="winner-showcase" class="hidden flex flex-col items-center mb-3 p-3 bg-slate-800 rounded-xl border border-emerald-500/40"></div>
        <h4 id="result-headline" class="font-bold text-center text-emerald-400 mb-2"></h4>
        <p class="text-center text-[11px] text-slate-400 mb-2">💡 아래 포켓몬 카드를 클릭하면 울음소리를 들을 수 있습니다!</p>
        <div id="result-pokemon-grid" class="grid grid-cols-4 sm:grid-cols-6 gap-2 max-h-48 overflow-y-auto"></div>
      </div>
    </div>

    <!-- 우측: 실시간 채팅 겸 정답 입력창 -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex flex-col h-[500px]">
      <h3 class="font-bold text-slate-300 mb-2">💬 실시간 채팅 & 정답 입력</h3>
      <div id="chat-log" class="flex-1 bg-slate-900 rounded-xl p-3 overflow-y-auto space-y-1.5 text-sm mb-3"></div>
      <form onsubmit="sendChatOrAnswer(event)" class="flex gap-2">
        <input id="chat-input" type="text" placeholder="채팅 또는 포켓몬 이름 입력..." autocomplete="off"
          class="flex-1 p-2.5 rounded-lg bg-slate-900 border border-slate-600 focus:outline-none focus:border-yellow-400" />
        <button type="submit" class="bg-yellow-500 text-slate-900 font-bold px-4 rounded-lg">전송</button>
      </form>
    </div>
  </div>

  <script>
    const socket = io();
    const TYPES = ['노말','불꽃','물','풀','전기','얼음','격투','독','땅','비행','에스퍼','벌레','바위','고스트','드래곤','악','강철','페어리'];
    let myId = null;
    let currentRoomState = null;

    // ==========================================
    // 🎵 사운드 엔진 (8비트 레트로 BGM + 효과음 + 포켓몬 공식 울음소리)
    // ==========================================
    let audioCtx = null;
    let bgmEnabled = false;
    let sfxEnabled = true;
    let masterVol = 0.5;
    let bgmInterval = null;
    let bgmStep = 0;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function changeVolume(val) {
      masterVol = parseFloat(val);
    }

    function playTone(freq, type, duration, delay = 0, volScale = 0.25) {
      if (!sfxEnabled && volScale !== 0.12) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

      const v = Math.max(0.001, masterVol * volScale);
      gain.gain.setValueAtTime(v, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    // 상황별 효과음 모음
    const SFX = {
      click: () => playTone(660, 'square', 0.07, 0, 0.2),
      roundStart: () => {
        playTone(440, 'square', 0.1, 0, 0.25);
        playTone(554, 'square', 0.1, 0.1, 0.25);
        playTone(659, 'square', 0.2, 0.2, 0.3);
      },
      specialAlert: () => {
        // 스페셜 라운드 사이렌 효과음
        [0, 0.2, 0.4].forEach(d => {
          playTone(880, 'sawtooth', 0.09, d, 0.3);
          playTone(587, 'sawtooth', 0.09, d + 0.1, 0.3);
        });
      },
      correct: () => {
        // 포켓몬 레벨업 / 정답 팡파레
        const notes = [523.25, 523.25, 523.25, 523.25, 415.30, 466.16, 523.25, 466.16, 523.25];
        const times = [0, 0.11, 0.22, 0.33, 0.46, 0.60, 0.74, 0.86, 0.98];
        const durs  = [0.09, 0.09, 0.09, 0.11, 0.12, 0.12, 0.10, 0.10, 0.40];
        notes.forEach((n, i) => playTone(n, 'square', durs[i], times[i], 0.3));
      },
      hint: () => {
        playTone(784, 'sine', 0.1, 0, 0.25);
        playTone(1046.5, 'sine', 0.2, 0.1, 0.25);
      },
      timeout: () => {
        playTone(300, 'sawtooth', 0.18, 0, 0.25);
        playTone(250, 'sawtooth', 0.18, 0.18, 0.25);
        playTone(200, 'sawtooth', 0.35, 0.36, 0.25);
      },
      victory: () => {
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
        const times = [0, 0.15, 0.30, 0.45, 0.65, 0.80];
        notes.forEach((n, i) => playTone(n, 'square', 0.2, times[i], 0.35));
      }
    };

    // 포켓몬 공식 울음소리 재생 함수 (PokeAPI Cries 연동)
    function playPokemonCry(pokemonId) {
      if (!sfxEnabled || !pokemonId) return;
      const cryUrl = `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${pokemonId}.ogg`;
      const audio = new Audio(cryUrl);
      audio.volume = Math.min(1, masterVol * 0.9);
      audio.play().catch(() => {
        // 구형 브라우저 또는 ogg 미지원 시 legacy 울음소리 폴백
        const fallback = new Audio(`https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/legacy/${pokemonId}.ogg`);
        fallback.volume = Math.min(1, masterVol * 0.9);
        fallback.play().catch(() => {});
      });
    }

    // 스프라이트 이미지 URL에서 포켓몬 ID 추출 헬퍼
    function extractIdFromImg(imgUrl) {
      if (!imgUrl) return null;
      const match = imgUrl.match(/\/(\d+)\.png$/);
      return match ? match[1] : null;
    }

    // 8비트 포켓몬 배틀 스타일 배경음악 루프
    const BGM_MELODY = [
      330, 392, 440, 392, 523, 494, 440, 392,
      349, 440, 523, 440, 587, 523, 494, 392,
      330, 392, 440, 523, 659, 587, 523, 494,
      440, 392, 349, 330, 294, 330, 392, 440
    ];

    function toggleBGM() {
      initAudio();
      bgmEnabled = !bgmEnabled;
      const btn = document.getElementById('btn-bgm');
      if (bgmEnabled) {
        btn.textContent = '🎵 BGM: ON';
        btn.className = 'bg-yellow-500 text-slate-900 px-3 py-1.5 rounded-lg font-bold transition';
        bgmStep = 0;
        bgmInterval = setInterval(() => {
          if (!bgmEnabled) return;
          const freq = BGM_MELODY[bgmStep % BGM_MELODY.length];
          playTone(freq, 'triangle', 0.16, 0, 0.12);
          if (bgmStep % 2 === 0) playTone(freq / 2, 'square', 0.12, 0, 0.06);
          bgmStep++;
        }, 190);
      } else {
        btn.textContent = '🎵 BGM: OFF';
        btn.className = 'bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg font-bold transition';
        clearInterval(bgmInterval);
      }
    }

    function toggleSFX() {
      initAudio();
      sfxEnabled = !sfxEnabled;
      const btn = document.getElementById('btn-sfx');
      if (sfxEnabled) {
        btn.textContent = '🔊 효과음/울음소리: ON';
        btn.className = 'bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg font-bold transition';
        SFX.click();
      } else {
        btn.textContent = '🔇 효과음/울음소리: OFF';
        btn.className = 'bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg font-bold transition';
      }
    }

    // ==========================================
    // 🌐 소켓 통신 및 게임 로직
    // ==========================================
    socket.on('connect', () => { myId = socket.id; });
    socket.on('error_msg', msg => alert(msg));

    function submitNickname() {
      initAudio();
      const name = document.getElementById('input-nickname').value.trim();
      if (!name) return alert('닉네임을 입력해 주세요!');
      SFX.click();
      // 입장 시 BGM 자동 시작을 원하면 아래 주석 해제 가능
      if (!bgmEnabled) toggleBGM();
      socket.emit('set_nickname', name);
    }

    socket.on('nickname_ok', () => {
      document.getElementById('screen-nickname').classList.add('hidden');
      document.getElementById('screen-lobby').classList.remove('hidden');
    });

    function createRoom() {
      SFX.click();
      const title = document.getElementById('room-title').value;
      const maxRounds = document.getElementById('room-rounds').value;
      socket.emit('create_room', { title, maxRounds });
    }

    function joinByCode(code) {
      SFX.click();
      const target = code || document.getElementById('join-code').value;
      socket.emit('join_room', target);
    }

    socket.on('room_list', (list) => {
      const container = document.getElementById('room-list-container');
      if (list.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-sm">현재 생성된 방이 없습니다.</p>`;
        return;
      }
      container.innerHTML = list.map(r => `
        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700">
          <div>
            <div class="font-bold text-sm">${r.title} <span class="text-xs text-yellow-400 font-mono">[${r.code}]</span></div>
            <div class="text-xs text-slate-400">${r.maxRounds}라운드 | ${r.playerCount}/${r.maxPlayers}명</div>
          </div>
          <button onclick="joinByCode('${r.code}')" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1.5 rounded font-bold">
            참가
          </button>
        </div>
      `).join('');
    });

    socket.on('room_update', (room) => {
      currentRoomState = room;
      document.getElementById('screen-lobby').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');

      document.getElementById('badge-room-code').textContent = `CODE: ${room.code}`;
      document.getElementById('badge-round').textContent = room.state === 'WAITING'
        ? `총 ${room.maxRounds}라운드`
        : `ROUND ${room.currentRound} / ${room.maxRounds}`;
      document.getElementById('player-count').textContent = room.players.length;

      // 참가자 렌더링
      const pList = document.getElementById('player-list');
      pList.innerHTML = room.players.map(p => {
        const isPickerA = room.pickers[0] === p.id;
        const isPickerB = room.pickers[1] === p.id;
        const badge = (isPickerA || isPickerB) ? `<span class="text-xs bg-pink-600 px-1.5 py-0.5 rounded ml-1">지목자</span>` : '';
        return `
          <div class="flex justify-between items-center bg-slate-900 px-3 py-2 rounded-lg">
            <span class="text-sm font-medium">${p.id === room.hostId ? '👑 ' : ''}${p.nickname}${badge}</span>
            <span class="text-yellow-400 font-bold text-sm">${p.score}점</span>
          </div>
        `;
      }).join('');

      // 방장 시작 버튼
      const startBtn = document.getElementById('btn-start-game');
      if (room.hostId === myId && (room.state === 'WAITING' || room.state === 'FINISHED')) {
        startBtn.classList.remove('hidden');
      } else {
        startBtn.classList.add('hidden');
      }

      // 지목 페이즈 UI
      const pickerBox = document.getElementById('type-picker-box');
      if (room.state === 'PICKING') {
        document.getElementById('round-result-box').classList.add('hidden');
        const mySlot = room.pickers[0] === myId && !room.selectedTypes.A ? 'A'
                     : room.pickers[1] === myId && !room.selectedTypes.B ? 'B' : null;

        document.getElementById('arena-status').innerHTML = `
          <h2 class="text-2xl font-bold text-yellow-400 mb-2">🎲 랜덤 지목자 2명이 타입을 고르는 중!</h2>
          <p class="text-slate-300 text-sm">선택 현황: 첫 번째 [${room.selectedTypes.A ? '선택 완료' : '고르는 중...'}] / 두 번째 [${room.selectedTypes.B ? '선택 완료' : '고르는 중...'}]</p>
        `;

        if (mySlot) {
          pickerBox.classList.remove('hidden');
          document.getElementById('picker-guide').textContent = `당신은 [${mySlot === 'A' ? '첫 번째' : '두 번째'} 지목자]입니다! 타입 하나를 선택하세요.`;
          document.getElementById('type-buttons').innerHTML = TYPES.map(t => `
            <button onclick="pickType('${mySlot}', '${t}')" class="bg-slate-700 hover:bg-yellow-500 hover:text-slate-900 font-bold py-2 rounded text-sm transition">
              ${t}
            </button>
          `).join('');
        } else {
          pickerBox.classList.add('hidden');
        }
      } else {
        pickerBox.classList.add('hidden');
      }
    });

    function startGame() {
      SFX.click();
      socket.emit('start_game');
    }

    function pickType(slot, type) {
      SFX.click();
      socket.emit('pick_type', { slot, type });
    }

    socket.on('quiz_start', ({ typeA, typeB, isSingle, specialLabel, totalCount }) => {
      document.getElementById('round-result-box').classList.add('hidden');
      if (specialLabel) {
        SFX.specialAlert();
      } else {
        SFX.roundStart();
      }

      const typeHeadline = isSingle ? `[ ${typeA} ] 단일 타입` : `[ ${typeA} + ${typeB} ] 복합 타입`;
      const specialBanner = specialLabel
        ? `<div class="mt-3 bg-gradient-to-r from-pink-600 to-purple-600 px-4 py-2 rounded-xl font-bold text-white animate-pulse">
             🚨 돌발 스페셜 라운드 (2점!): ${specialLabel}
           </div>`
        : `<div class="mt-2 text-xs text-slate-400">일반 라운드 (추가 조건 없음, 1점)</div>`;

      document.getElementById('arena-status').innerHTML = `
        <div class="text-xs text-emerald-400 font-bold mb-1">해당하는 포켓몬 총 ${totalCount}마리 존재!</div>
        <h2 class="text-3xl font-extrabold text-white">${typeHeadline}</h2>
        ${specialBanner}
        <p class="mt-4 text-sm text-yellow-300">우측 채팅창에 정답 포켓몬 이름을 가장 먼저 입력하세요!</p>
        <div id="hint-area" class="mt-3 flex flex-col items-center"></div>
      `;
      document.getElementById('chat-input').focus();
    });

    socket.on('quiz_hint', ({ lengthHint, silhouetteImg }) => {
      SFX.hint();
      const hintArea = document.getElementById('hint-area');
      if (!hintArea) return;
      hintArea.innerHTML = `
        <p class="text-xs text-amber-300 mb-1">💡 ${lengthHint}</p>
        <img src="${silhouetteImg}" class="w-20 h-20 brightness-0 invert opacity-80" title="실루엣 힌트" />
      `;
    });

    socket.on('round_result', ({ winnerName, pointsEarned, matchedPokemon, allAnswers, totalAnswerCount }) => {
      const box = document.getElementById('round-result-box');
      const showcase = document.getElementById('winner-showcase');
      box.classList.remove('hidden');

      const headline = document.getElementById('result-headline');
      if (winnerName && matchedPokemon) {
        SFX.correct();
        // 팡파레 직후 정답 포켓몬 공식 울음소리 출력!
        setTimeout(() => playPokemonCry(matchedPokemon.id), 350);

        showcase.classList.remove('hidden');
        showcase.innerHTML = `
          <div class="flex items-center gap-4">
            <img src="${matchedPokemon.img}" class="w-20 h-20 animate-bounce cursor-pointer" onclick="playPokemonCry(${matchedPokemon.id})" title="클릭하여 울음소리 다시 듣기" />
            <div class="text-left">
              <div class="text-xs text-emerald-400 font-bold">정답 포켓몬</div>
              <div class="text-xl font-extrabold text-white">${matchedPokemon.name_ko}</div>
              <button onclick="playPokemonCry(${matchedPokemon.id})" class="mt-1 text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded text-yellow-300 font-bold">
                🔊 울음소리 다시 듣기
              </button>
            </div>
          </div>
        `;
        headline.textContent = `🎉 ${winnerName}님이 정답을 맞혔습니다! (+${pointsEarned}점)`;
      } else {
        SFX.timeout();
        showcase.classList.add('hidden');
        headline.textContent = `⏰ 시간 초과! 아무도 맞히지 못했습니다.`;
      }

      document.getElementById('result-pokemon-grid').innerHTML = allAnswers.map(p => {
        const pid = extractIdFromImg(p.img);
        return `
          <div onclick="playPokemonCry('${pid}')" class="bg-slate-800 hover:bg-slate-700 cursor-pointer p-1.5 rounded text-center border border-slate-700 transition" title="클릭하면 울음소리 재생">
            <img src="${p.img}" class="w-12 h-12 mx-auto" />
            <div class="text-[11px] truncate">${p.name}</div>
          </div>
        `;
      }).join('');
    });

    socket.on('game_over', ({ rankings }) => {
      SFX.victory();
      const top = rankings[0];
      document.getElementById('arena-status').innerHTML = `
        <h2 class="text-3xl font-extrabold text-yellow-400 mb-2">🏆 게임 종료! 최종 우승: ${top ? top.nickname : '-'}</h2>
        <p class="text-slate-300 text-sm">방장이 [게임 시작하기]를 누르면 새 게임을 시작합니다.</p>
      `;
    });

    function sendChatOrAnswer(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      if (!input.value.trim()) return;
      socket.emit('chat_or_answer', input.value);
      input.value = '';
    }

    socket.on('chat_msg', ({ nickname, text }) => {
      const log = document.getElementById('chat-log');
      log.innerHTML += `<div><span class="font-bold text-blue-300">${nickname}:</span> <span>${text}</span></div>`;
      log.scrollTop = log.scrollHeight;
    });

    socket.on('system_msg', (msg) => {
      const log = document.getElementById('chat-log');
      log.innerHTML += `<div class="text-yellow-400 text-xs font-semibold">${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    });
  </script>
</body>
</html>
